name: yanshu-server
services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?Run scripts/bootstrap_local.py first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run scripts/bootstrap_local.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - yanshu_pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-yanshu.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  yanshu_pgdata:
